name: WEEX live read-only smoke test

on:
  push:
    branches:
      - feature/two-sided-market-radar

permissions:
  contents: read

concurrency:
  group: weex-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out radar branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Read five public WEEX candle timeframes
        run: python scripts/weex_live_smoke_test.py
